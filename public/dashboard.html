<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistema de Gestión</title>
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar cargado dinámicamente -->
    
    <!-- Contenido principal -->
    <main class="main-content">
      <header class="dashboard-header">
        <div class="header-left">
          <h1>Panel Principal</h1>
        </div>
        <button id="logoutBtn" class="btn-primary">Cerrar sesión</button>
      </header>

      <section class="content-section">
        <div class="stats-cards">
          <div class="stat-card">
            <div class="stat-label">Órdenes Pendientes</div>
            <div class="stat-number" id="stat-pendientes">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">En Proceso</div>
            <div class="stat-number" id="stat-proceso">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Completadas</div>
            <div class="stat-number" id="stat-completadas">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Órdenes</div>
            <div class="stat-number" id="stat-total">0</div>
          </div>
        </div>

        <div class="dashboard-cards">
          <div class="card">
            <h2>Órdenes de Servicio pendientes</h2>
            <ul id="proximasOrdenesList" class="proximas-ordenes-list">
              <li class="no-ordenes">Cargando órdenes...</li>
            </ul>
            <a href="agenda.html" class="ver-todas">Ver calendario completo →</a>
          </div>

          <div class="card">
            <h2>Reclamos </h2>
            <ul id="reclamosList" class="reclamos-list">
              <li class="no-reclamos">Cargando...</li>
            </ul>
            <a href="reclamos.html" class="ver-todas">Ver todos los reclamos →</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/sidebar-loader.js"></script>
</body>
</html>
