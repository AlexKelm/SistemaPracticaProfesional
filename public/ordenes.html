<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes - Sistema de Gestión</title>
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ordenes.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar cargado dinámicamente -->
    
    <!-- Contenido principal -->
    <main class="main-content">
      <header class="dashboard-header">
        <div class="header-left">
          <h1 class="titulo">Gestión de Órdenes</h1>
        </div>
        <button id="logoutBtn" class="btn-primary">Cerrar sesión</button>
      </header>

      <section class="content-section">
        <div class="ordenes-header">
          <button class="btn-primary" id="btnNuevaOrden">+ Nueva Orden</button>
          <div class="buscador">
            <input type="text" id="buscarOrden" placeholder="🔍 Buscar orden...">
          </div>
        </div>

        <div class="table-container">
          <table class="ordenes-table">
            <thead>
              <tr>
                <th>ID Orden</th>
                <th>Cliente</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Prioridad</th>
                <th>Fecha Creación</th>
                <th>Fecha Servicio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaOrdenes">
              <!-- Las filas se generan dinámicamente -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Modal para nueva/edición de orden -->
      <div id="modalNuevaOrden" class="modal" style="display:none;">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="modalTitulo">Nueva Orden</h2>
            <button type="button" class="btn-close" id="btnCerrarModalOrden">&times;</button>
          </div>
          <form id="formNuevaOrden">
            <div class="form-group">
              <label>Cliente:</label>
              <select id="selectCliente" required></select>
            </div>
            <div class="form-group">
              <label>Tipo de Servicio:</label>
              <select id="selectTipoServicio" required></select>
            </div>
            <div class="form-group">
              <label>Técnico Asignado:</label>
              <select id="selectTecnico" required></select>
            </div>
            <div class="form-group">
              <label>Descripción / Observaciones:</label>
              <textarea id="inputObservacion"></textarea>
            </div>
            <div class="form-group">
              <label>Estado:</label>
              <select id="selectEstado">
                <option value="pendiente">Pendiente</option>
                <option value="en_proceso">En Proceso</option>
                <option value="completada">Completada</option>
                <option value="cancelada">Cancelada</option>
              </select>
            </div>
            <div class="form-group">
              <label>Prioridad:</label>
              <select id="selectPrioridad">
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>
              </select>
            </div>
            <div class="form-group">
              <label>Costo ($):</label>
              <input type="number" id="inputCosto" step="0.01" min="0" value="0.00">
            </div>
            <div class="form-group">
              <label>Fecha Creación:</label>
              <input type="date" id="inputFechaCreacion" required>
            </div>
            <div class="form-group">
              <label>Fecha Servicio:</label>
              <input type="date" id="inputFechaServicio">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Guardar</button>
              <button type="button" id="btnCancelarModal" class="btn-secondary">Cancelar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modal para ver detalles de la orden -->
      <div id="modalVerOrden" class="modal" style="display:none;">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Detalle de la Orden</h2>
            <button type="button" class="btn-close" id="btnCerrarVerOrden">&times;</button>
          </div>
          <div id="contenidoVerOrden"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/sidebar-loader.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ordenes.js"></script>
</body>
</html>
